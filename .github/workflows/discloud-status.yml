name: Discloud Status & Restart

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force_restart:
        description: 'Force container restart even if online'
        required: false
        default: 'false'
        type: boolean
      action:
        description: 'Lifecycle action: status, stop, start, restart'
        required: false
        default: 'status'
        type: choice
        options:
          - status
          - stop
          - start
          - restart

permissions:
  contents: read
  actions: write

jobs:
  status:
    runs-on: ubuntu-latest
    environment:
      name: discloud-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Status and Logs
        env:
          DISCLOUD_TOKEN: ${{ secrets.DISCLOUD_TOKEN }}
          DISCLOUD_APP_ID: '1788873398156'
          FORCE_RESTART: ${{ inputs.force_restart }}
          DISCLOUD_ACTION: ${{ inputs.action || 'status' }}
          DISCLOUD_MAINTENANCE_HOLD: ${{ vars.DISCLOUD_MAINTENANCE_HOLD || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discloud-status.mjs
